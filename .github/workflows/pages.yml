# Deploys cambr.uk. Every push to main copies the tracked files as they are and
# renders the partner pages (/carmods) from index.html. See tools/build_site.py.
#
# Check a deploy:   gh run list --workflow pages.yml -L 1
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Build site
        run: python3 tools/build_site.py _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # Required: .well-known/ holds the iOS and Android app-link files.
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
