<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8"><title>Cambr Pricing</title>
<!-- /pricing/ -> /pricing. GitHub Pages serves pricing.html at /pricing and 404s the slash form without this file.
     The script keeps any ?query and #hash; the refresh is for no JavaScript. Do not move pricing.html in here. -->
<link rel="canonical" href="https://cambr.uk/pricing">
<script>location.replace('/pricing' + location.search + location.hash);</script>
<meta http-equiv="refresh" content="0; url=/pricing">
</head>
<body><p>Redirecting to <a href="/pricing">cambr.uk/pricing</a>…</p></body></html>
