<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Cambr</title>
<meta name="theme-color" content="#141414">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<script>
  /* GitHub Pages serves this page for any path with no file behind it.
     A convoy invite (Cambr app row 41.12) is https://cambr.uk/c/<code>: with the app installed the phone opens the app
     (apple-app-site-association /c/*, assetlinks.json + the app's /c/ intent filter) and this never loads. Without the
     app it lands here, and goes on to the homepage's invite state with the code in the fragment (index.html,
     html[data-invite]) — the fragment never reaches analytics, and this page loads none. Every other missing path
     shows the plain "not found" below. Same alphabet as the app (lib/convoy.ts CODE_ALPHABET). */
  (function () {
    var m = /^\/c\/([A-Za-z0-9]{4})\/?$/.exec(window.location.pathname);
    if (!m) return;
    var code = m[1].toUpperCase();
    if (!/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{4}$/.test(code)) return;
    window.location.replace("/#c=" + code);
  })();
</script>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #141414; color: #F5F5F5;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box;
  }
  .box { max-width: 420px; }
  img { display: block; margin: 0 auto 28px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  p { color: #8A8A8A; font-size: 15px; line-height: 1.5; margin: 12px 0 0; }
  a.home {
    display: inline-block; margin-top: 28px; padding: 14px 26px; border-radius: 999px;
    background: #D40000; color: #fff; text-decoration: none; font-weight: 600; font-size: 15px;
  }
</style>
</head>
<body>
  <div class="box">
    <img src="/assets/cambr-lockup-horizontal.svg" alt="Cambr" width="102" height="28">
    <h1>Page not found</h1>
    <p>That page isn't here.</p>
    <a class="home" href="/">Go to cambr.uk</a>
  </div>
</body>
</html>
